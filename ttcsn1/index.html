<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học OOP qua Flashcard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141a; --panel:#1a1d25; --panel-raised:#20242e; --border:#2a2f3b;
    --text:#e7e9ee; --text-dim:#9aa1ae; --text-faint:#656c7a;
    --accent:#e8a33d; --ok:#6fcf97; --err:#eb6a6a;
    --kw:#e8a33d; --str:#8fbf7f; --cm:#656c7a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased; }
  code, pre, textarea{ font-family:'IBM Plex Mono', monospace; }
  button{ font-family:'IBM Plex Sans', sans-serif; }

  .app{ display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  .app.home-layout{ grid-template-columns:1fr; }

  /* sidebar */
  .sidebar{ background:var(--panel); border-right:1px solid var(--border); padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand{ padding:0 20px 16px 20px; border-bottom:1px solid var(--border); margin-bottom:10px; cursor:pointer; }
  .brand .mark{ font-size:12.5px; color:var(--accent); font-family:'IBM Plex Mono', monospace; }
  .brand h1{ font-size:16px; margin:6px 0 0 0; font-weight:600; line-height:1.3; }
  .nav-group-label{ font-size:11.5px; color:var(--text-faint); padding:14px 20px 6px 20px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:8px 20px; cursor:pointer; font-size:13.5px; color:var(--text-dim); border-left:2px solid transparent; }
  .nav-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--border); flex-shrink:0; }
  .nav-item:hover{ background:var(--panel-raised); color:var(--text); }
  .nav-item.active{ color:var(--text); background:var(--panel-raised); border-left-color:var(--accent); }
  .nav-item.active .dot{ background:var(--accent); }
  .nav-item.seen .dot{ background:var(--ok); }

  main{ padding:40px 56px 70px 56px; max-width:860px; }
  .home main, .app.home-layout main{ max-width:1000px; margin:0 auto; padding:60px 40px; }

  .topbar{ display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .back-btn{ background:none; border:1px solid var(--border); color:var(--text-dim); padding:7px 14px; border-radius:6px; font-size:13px; cursor:pointer; }
  .back-btn:hover{ border-color:var(--accent); color:var(--text); }
  .topbar h2{ font-size:20px; margin:0; font-weight:600; }

  /* ---------- home ---------- */
  .home-hero{ text-align:center; margin-bottom:48px; }
  .home-hero .mark{ font-size:13px; color:var(--accent); font-family:'IBM Plex Mono', monospace; }
  .home-hero h1{ font-size:32px; margin:10px 0 10px 0; font-weight:700; letter-spacing:-.01em; }
  .home-hero p{ color:var(--text-dim); font-size:15px; max-width:560px; margin:0 auto; line-height:1.6; }

  .usecase-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
  .usecase-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px 24px; cursor:pointer; transition:border-color .15s ease, transform .15s ease; }
  .usecase-card:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .usecase-card .icon{ width:44px; height:44px; border-radius:10px; background:var(--panel-raised); display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:16px; }
  .usecase-card h3{ font-size:17px; margin:0 0 8px 0; font-weight:600; }
  .usecase-card p{ font-size:13.5px; color:var(--text-dim); line-height:1.6; margin:0 0 14px 0; }
  .usecase-card .cta{ font-size:12.5px; color:var(--accent); }
  @media (max-width:760px){ .usecase-grid{ grid-template-columns:1fr; } }

  /* ---------- flashcard ---------- */
  .flashcard{ perspective:1600px; margin-bottom:8px; }
  .flip-inner{ position:relative; transition:transform .5s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; min-height:150px; }
  .flashcard.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{ backface-visibility:hidden; border:1px solid var(--border); border-radius:12px; padding:26px 28px; }
  .face.front{ background:linear-gradient(160deg, var(--panel-raised), var(--panel)); display:flex; flex-direction:column; justify-content:center; min-height:150px; cursor:pointer; }
  .face.back{ position:absolute; inset:0; transform:rotateY(180deg); background:var(--panel); overflow-y:auto; cursor:pointer; }
  .face.back.expanded{ position:relative; max-height:none; overflow:visible; }
  .front .eyebrow{ font-size:12px; color:var(--accent); margin-bottom:8px; font-family:'IBM Plex Mono', monospace; }
  .front h2{ font-size:23px; margin:0 0 10px 0; font-weight:600; letter-spacing:-.01em; }
  .front .teaser{ font-size:14px; color:var(--text-dim); line-height:1.6; margin:0; }
  .front .flip-hint, .back .flip-hint{ margin-top:16px; font-size:12px; color:var(--text-faint); }
  .back h3{ font-size:15px; margin:0 0 14px 0; color:var(--accent); font-weight:600; }
  .theory{ font-size:14.5px; line-height:1.75; color:#cfd3db; margin-bottom:18px; }
  .theory p{ margin:0 0 12px 0; }
  .theory strong{ color:var(--text); font-weight:600; }
  .section-label{ font-size:12px; color:var(--text-faint); margin:22px 0 10px 0; display:flex; align-items:center; gap:8px; }
  .section-label::after{ content:""; flex:1; height:1px; background:var(--border); }
  pre.example{ background:#15171e; border:1px solid var(--border); border-radius:8px; padding:16px 18px; font-size:12.8px; line-height:1.65; overflow-x:auto; color:var(--text); margin:0; }
  .kw{ color:var(--kw); } .str{ color:var(--str); } .cm{ color:var(--cm); }

  .footer-nav{ display:flex; justify-content:space-between; margin-top:32px; padding-top:20px; border-top:1px solid var(--border); }
  .footer-nav button{ background:none; border:1px solid var(--border); color:var(--text-dim); padding:9px 16px; border-radius:6px; font-size:13px; cursor:pointer; }
  .footer-nav button:hover{ border-color:var(--accent); color:var(--text); }
  .footer-nav button:disabled{ opacity:.35; cursor:default; }

  /* ---------- quiz ---------- */
  .quiz-picker{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:10px; }
  .quiz-opt{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px 18px; cursor:pointer; }
  .quiz-opt:hover{ border-color:var(--accent); }
  .quiz-opt h4{ margin:0 0 4px 0; font-size:14.5px; font-weight:600; }
  .quiz-opt span{ font-size:12.5px; color:var(--text-faint); }
  .quiz-opt.full{ grid-column:1 / -1; background:linear-gradient(160deg, var(--panel-raised), var(--panel)); }

  .quiz-progress{ font-size:12.5px; color:var(--text-faint); margin-bottom:8px; }
  .quiz-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:26px 28px; }
  .quiz-card .cat{ font-size:12px; color:var(--accent); margin-bottom:10px; font-family:'IBM Plex Mono', monospace; }
  .quiz-card .q{ font-size:17px; font-weight:600; margin:0 0 20px 0; line-height:1.5; }
  .opt-btn{ display:block; width:100%; text-align:left; background:var(--panel-raised); border:1px solid var(--border); color:var(--text); padding:12px 16px; border-radius:8px; margin-bottom:10px; cursor:pointer; font-size:14px; }
  .opt-btn:hover:not(:disabled){ border-color:var(--accent); }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct{ border-color:var(--ok); background:rgba(111,207,151,.1); color:var(--ok); }
  .opt-btn.wrong{ border-color:var(--err); background:rgba(235,106,106,.1); color:var(--err); }
  .explain{ font-size:13.5px; color:var(--text-dim); line-height:1.6; margin:14px 0 18px 0; padding:12px 14px; background:var(--panel-raised); border-radius:8px; display:none; }
  .explain.show{ display:block; }
  .next-btn{ background:var(--accent); color:#1a1305; border:none; padding:9px 20px; border-radius:6px; font-size:13.5px; font-weight:600; cursor:pointer; display:none; }
  .next-btn.show{ display:inline-block; }

  .result-card{ text-align:center; padding:50px 20px; }
  .result-card .score{ font-size:46px; font-weight:700; color:var(--accent); margin-bottom:6px; }
  .result-card .pct{ font-size:15px; color:var(--text-dim); margin-bottom:28px; }
  .result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .result-actions button{ background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:7px; font-size:13.5px; cursor:pointer; }
  .result-actions button:hover{ border-color:var(--accent); }
  .result-actions button.primary{ background:var(--accent); color:#1a1305; border:none; font-weight:600; }

  /* ---------- stats ---------- */
  .stat-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:30px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px 20px; }
  .stat-card .num{ font-size:26px; font-weight:700; color:var(--accent); }
  .stat-card .label{ font-size:12.5px; color:var(--text-dim); margin-top:4px; }
  .bar-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; font-size:13px; }
  .bar-row .name{ width:120px; flex-shrink:0; color:var(--text-dim); }
  .bar-track{ flex:1; height:10px; background:var(--panel-raised); border-radius:5px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); }
  .bar-row .pct{ width:42px; text-align:right; color:var(--text-faint); font-size:12px; }
  .history-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; color:var(--text-dim); }
  .empty-state{ color:var(--text-faint); font-size:13.5px; padding:30px 0; text-align:center; }
  .note{ font-size:12px; color:var(--text-faint); margin-top:24px; }

  @media (max-width:760px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ position:relative; height:auto; }
    main{ padding:26px 18px 60px 18px; }
    .stat-cards{ grid-template-columns:1fr; }
    .quiz-picker{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   DỮ LIỆU: FLASHCARD LÝ THUYẾT
   ============================================================ */
const topics = [
{ id:"oop-intro", title:"OOP Là Gì",
  front:"Lập trình hướng đối tượng (OOP) tổ chức chương trình như thế nào?",
  theory:[
    "OOP là mô hình lập trình tổ chức chương trình xoay quanh các <strong>đối tượng</strong>. Mỗi đối tượng có dữ liệu riêng và hành vi riêng.",
    "Trong Java, OOP giúp code dễ hiểu hơn, dễ bảo trì, dễ mở rộng và gần với cách ta mô tả thế giới thực. Ví dụ: một con chó có tên, cân nặng, màu lông và có hành vi sủa, ăn, chạy."
  ],
  example:
`class Dog {
    String name;
    double weight;

    void bark() {
        System.out.println("Gau Gau");
    }
}`
},
{ id:"class", title:"Class",
  front:"Class trong Java được hiểu là gì?",
  theory:[
    "Class là <strong>bản thiết kế, khuôn mẫu</strong> để tạo ra đối tượng. Class định nghĩa đối tượng sẽ có những thuộc tính nào và hành vi nào.",
    "Có thể hiểu <code>Student</code> là kiểu dữ liệu do lập trình viên tự định nghĩa."
  ],
  example:
`class Student {
    String name;
    int age;

    void study() {
        System.out.println("Student is studying");
    }
}`
},
{ id:"object", title:"Object",
  front:"Object khác Class ở điểm nào?",
  theory:[
    "Object là một <strong>thực thể cụ thể</strong> được tạo ra từ class. Ở <code>Student student = new Student();</code>, <code>student</code> là một object được tạo từ class <code>Student</code>.",
    "Object thường gồm hai phần: <strong>Attribute</strong> (dữ liệu, đặc điểm) và <strong>Method</strong> (hành vi, chức năng)."
  ],
  example:
`Student student = new Student();
// "student" là object được tạo từ class Student`
},
{ id:"attribute", title:"Attribute",
  front:"Attribute dùng để lưu trữ điều gì về một đối tượng?",
  theory:[
    "Attribute là <strong>thuộc tính</strong> của đối tượng, dùng để lưu thông tin hoặc trạng thái. Trong class <code>Student</code>, <code>name</code> và <code>age</code> là attribute.",
    "Ví dụ thực tế: Sinh viên — tên, tuổi, mã sinh viên, GPA. Tài khoản ngân hàng — số tài khoản, chủ tài khoản, số dư. Động vật — tên, cân nặng, màu sắc."
  ],
  example:
`class Student {
    String name;  // attribute
    int age;      // attribute
}`
},
{ id:"method", title:"Method",
  front:"Method khác Attribute ở điểm nào?",
  theory:[
    "Method là <strong>phương thức</strong>, tức hành vi hoặc chức năng của đối tượng.",
    "Ví dụ thực tế: Sinh viên có thể học, làm bài, điểm danh. Tài khoản ngân hàng có thể nạp tiền, rút tiền, chuyển tiền. Động vật có thể ăn, ngủ, phát ra âm thanh."
  ],
  example:
`void study() {
    System.out.println("Student is studying");
}`
},
{ id:"encapsulation", title:"Đóng Gói",
  front:"Làm sao để không ai sửa dữ liệu của object một cách tùy tiện?",
  theory:[
    "Đóng gói là việc <strong>che giấu dữ liệu bên trong class</strong>, không cho bên ngoài truy cập hoặc thay đổi trực tiếp. Dữ liệu được thao tác thông qua getter, setter hoặc method nghiệp vụ.",
    "<code>balance</code> được để <code>private</code> nên bên ngoài không thể sửa trực tiếp — muốn thay đổi số dư phải thông qua <code>deposit()</code> hoặc <code>withdraw()</code>, giúp bảo vệ dữ liệu và đảm bảo logic chương trình đúng."
  ],
  example:
`public class User {
    private double balance;

    public double getBalance() {
        return balance;
    }

    public void deposit(double amount) {
        if (amount > 0) {
            balance += amount;
        }
    }

    public void withdraw(double amount) {
        if (amount > 0 && balance >= amount) {
            balance -= amount;
        }
    }
}`
},
{ id:"inheritance", title:"Kế Thừa",
  front:"Làm sao để class con dùng lại code của class cha mà không phải viết lại?",
  theory:[
    "Kế thừa cho phép class con <strong>sử dụng lại thuộc tính và phương thức</strong> của class cha, giảm lặp code và thể hiện quan hệ <strong>\"is-a\"</strong> (Dog là một Animal).",
    "<code>Dog</code> kế thừa từ <code>Animal</code> bằng <code>extends</code>, có thể dùng thành phần của <code>Animal</code>, đồng thời ghi đè phương thức cho phù hợp riêng. Trong Java, một class chỉ được kế thừa trực tiếp từ một class cha."
  ],
  example:
`class Animal {
    private double weight;

    public void makeSound() {
        System.out.println("Some sound");
    }
}

class Dog extends Animal {
    @Override
    public void makeSound() {
        System.out.println("Gau Gau");
    }
}`
},
{ id:"polymorphism", title:"Đa Hình",
  front:"Vì sao cùng một lời gọi phương thức lại cho ra hành vi khác nhau?",
  theory:[
    "Đa hình nghĩa là cùng một lời gọi phương thức nhưng cho ra hành vi khác nhau tùy vào đối tượng thực tế. Có hai dạng phổ biến:",
    "<strong>Overloading (nạp chồng)</strong>: cùng tên method nhưng khác tham số — Java chọn method phù hợp dựa trên kiểu/số lượng tham số lúc compile.",
    "<strong>Overriding (ghi đè)</strong>: class con định nghĩa lại method đã có ở class cha. Khi gọi <code>makeSound()</code>, nếu object là <code>Dog</code> thì in \"Gau Gau\", nếu là <code>Cat</code> thì in \"Meo Meo\"."
  ],
  example:
`// Overloading
class Calculator {
    int sum(int a, int b) { return a + b; }
    double sum(double a, double b) { return a + b; }
}

// Overriding
class Animal {
    public void makeSound() { System.out.println("Some sound"); }
}
class Dog extends Animal {
    @Override
    public void makeSound() { System.out.println("Gau Gau"); }
}
class Cat extends Animal {
    @Override
    public void makeSound() { System.out.println("Meo Meo"); }
}`
},
{ id:"abstraction", title:"Trừu Tượng",
  front:"Người dùng một class cần biết 'làm như thế nào' hay chỉ cần biết 'làm được gì'?",
  theory:[
    "Trừu tượng là việc tập trung vào đối tượng <strong>\"làm được gì\"</strong> thay vì \"làm như thế nào\" — chỉ định nghĩa hành vi cần có, chi tiết triển khai để class con xử lý.",
    "Java có hai cách thể hiện: <strong>abstract class</strong> (có thể chứa thuộc tính, method thường và abstract method) và <strong>interface</strong> (định nghĩa nhóm hành vi mà nhiều class khác nhau có thể cùng triển khai, qua <code>implements</code>)."
  ],
  example:
`abstract class Animal {
    String name;
    abstract void makeSound();
    void sleep() { System.out.println("Sleeping"); }
}

interface Flyable { void fly(); }
interface Swimmable { void swim(); }

class Duck implements Flyable, Swimmable {
    public void fly() { System.out.println("Duck flies"); }
    public void swim() { System.out.println("Duck swims"); }
}`
}
];

/* ============================================================
   DỮ LIỆU: TRẮC NGHIỆM (24 câu, 8 nhóm x 3 câu)
   ============================================================ */
const quizBank = [
 // Object
 { cat:"Object", q:"Object trong OOP là gì?", opts:["Một kiểu dữ liệu nguyên thủy","Một thực thể cụ thể được tạo ra từ class","Một vòng lặp trong Java","Một câu lệnh điều kiện"], correct:1, exp:"Object là thực thể cụ thể được tạo ra từ class, tồn tại thật trong bộ nhớ." },
 { cat:"Object", q:"Một object thường bao gồm những gì?", opts:["Biến và toán tử","Thuộc tính và phương thức","Package và thư viện","Constructor và comment"], correct:1, exp:"Object gồm Attribute (dữ liệu) và Method (hành vi)." },
 { cat:"Object", q:"Trong câu lệnh Student s = new Student();, object được nhắc đến là gì?", opts:["Student","new","s","String"], correct:2, exp:"\"s\" là biến tham chiếu tới object vừa được tạo ra." },
 // Class
 { cat:"Class", q:"Class trong Java được hiểu là gì?", opts:["Bản thiết kế để tạo object","Một giá trị cụ thể","Một phép toán","Một câu lệnh nhập dữ liệu"], correct:0, exp:"Class là khuôn mẫu định nghĩa thuộc tính và hành vi cho object." },
 { cat:"Class", q:"Class có thể chứa những thành phần nào?", opts:["Attribute và method","Chỉ chứa số nguyên","Chỉ chứa vòng lặp","Chỉ chứa comment"], correct:0, exp:"Class chứa attribute (dữ liệu) và method (hành vi)." },
 { cat:"Class", q:"Tên class trong Java thường đặt theo quy tắc nào?", opts:["camelCase","PascalCase","snake_case","Viết thường toàn bộ"], correct:1, exp:"Quy ước Java: tên class viết hoa chữ cái đầu mỗi từ, ví dụ Student, BankAccount." },
 // Attribute
 { cat:"Attribute", q:"Attribute là gì?", opts:["Hành vi của đối tượng","Thuộc tính lưu trữ thông tin của đối tượng","Tên package","Câu lệnh kết thúc chương trình"], correct:1, exp:"Attribute lưu dữ liệu/trạng thái của object." },
 { cat:"Attribute", q:"Trong class Student, thuộc tính nào phù hợp nhất?", opts:["study()","run()","name","main()"], correct:2, exp:"name là dữ liệu mô tả sinh viên, nên là attribute; study() là method." },

/* ============================================================
   STATE
   ============================================================ */
let view = "home";          // home | flashcard | quiz-pick | quiz-run | quiz-result | stats
let currentTopicIndex = 0;
const seenTopics = new Set();

let activeQuiz = [];        // mảng câu hỏi của lượt hiện tại
let activeCatLabel = "";
let lastCatKey = "__all__";
let qIndex = 0;
let qScore = 0;
let answered = false;

const quizHistory = [];     // {date, cat, total, correct, perCat:{cat:{total,correct}}}

/* ============================================================
   TIỆN ÍCH
   ============================================================ */
function escapeHtml(str){
  return str.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}
function highlightJava(code){
  const escaped = escapeHtml(code);
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b(class|public|private|protected|static|void|new|extends|implements|abstract|interface|return|if|else|int|double|String|boolean|this|super|true|false)\b/gm;
  return escaped.replace(re, (m, cm, str, kw) => {
    if (cm) return `<span class="cm">${cm}</span>`;
    if (str) return `<span class="str">${str}</span>`;
    if (kw) return `<span class="kw">${kw}</span>`;
    return m;
  });
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  app.className = "app" + (view === "home" ? " home-layout" : "");

  if (view === "home"){ app.innerHTML = renderHome(); attachHome(); return; }

  // các view còn lại dùng layout sidebar + main (flashcard dùng sidebar chủ đề,
  // quiz/stats dùng main full-width nhưng vẫn giữ khung chung cho nhất quán)
  app.innerHTML = `
    <aside class="sidebar">
      <div class="brand" id="brandHome">
        <div class="mark">// oop-module</div>
        <h1>Học OOP qua Flashcard</h1>
      </div>
      ${view === "flashcard" ? renderTopicNav() : renderSimpleNav()}
    </aside>
    <main id="main"></main>
  `;
  document.getElementById("brandHome").addEventListener("click", () => { view = "home"; render(); });

  const main = document.getElementById("main");
  if (view === "flashcard") main.innerHTML = renderFlashcardView();
  else if (view === "quiz-pick") main.innerHTML = renderQuizPick();
  else if (view === "quiz-run") main.innerHTML = renderQuizRun();
  else if (view === "quiz-result") main.innerHTML = renderQuizResult();
  else if (view === "stats") main.innerHTML = renderStats();

  attachViewHandlers();
}

/* ============================================================
   HOME (3 use case)
   ============================================================ */
function renderHome(){
  return `
  <main>
    <div class="home-hero">
      <div class="mark">// oop-module</div>
      <h1>Học Lập trình hướng đối tượng qua Flashcard</h1>
      <p>Chọn một trong ba hoạt động bên dưới — đúng theo use case của Người dùng: học lý thuyết, tự kiểm tra, rồi xem lại kết quả học tập.</p>
    </div>
    <div class="usecase-grid">
      <div class="usecase-card" id="ucFlashcard">
        <div class="icon">📇</div>
        <h3>Học OOP qua flashcard</h3>
        <p>9 chủ đề lý thuyết OOP cốt lõi — Class, Object, Attribute, Method và 4 tính chất — mỗi thẻ lật để xem ví dụ Java thực tế.</p>
        <div class="cta">Bắt đầu học →</div>
      </div>
      <div class="usecase-card" id="ucQuiz">
        <div class="icon">📝</div>
        <h3>Kiểm tra</h3>
        <p>24 câu trắc nghiệm chia theo 8 nhóm kiến thức. Làm từng nhóm hoặc làm trọn bộ để tự đánh giá mức độ nắm bài.</p>
        <div class="cta">Làm bài kiểm tra →</div>
      </div>
      <div class="usecase-card" id="ucStats">
        <div class="icon">📊</div>
        <h3>Xem thống kê kết quả học tập</h3>
        <p>Theo dõi số lần làm bài, điểm trung bình và tỉ lệ đúng theo từng nhóm kiến thức trong phiên học hiện tại.</p>
        <div class="cta">Xem thống kê →</div>
      </div>
    </div>
  </main>`;
}
function attachHome(){
  document.getElementById("ucFlashcard").addEventListener("click", () => { view = "flashcard"; render(); });
  document.getElementById("ucQuiz").addEventListener("click", () => { view = "quiz-pick"; render(); });
  document.getElementById("ucStats").addEventListener("click", () => { view = "stats"; render(); });
}

/* ============================================================
   FLASHCARD VIEW
   ============================================================ */
function renderTopicNav(){
  let html = `<div class="nav-group-label">9 chủ đề</div>`;
  topics.forEach((t, i) => {
    html += `<div class="nav-item ${i === currentTopicIndex ? "active" : ""} ${seenTopics.has(t.id) ? "seen" : ""}" data-topic="${i}">
      <span class="dot"></span><span>${t.title}</span>
    </div>`;
  });
  return html;
}
function renderSimpleNav(){
  return `
    <div class="nav-group-label">Điều hướng</div>
    <div class="nav-item" data-goto="quiz-pick"><span class="dot"></span><span>Kiểm tra</span></div>
    <div class="nav-item" data-goto="stats"><span class="dot"></span><span>Thống kê</span></div>
    <div class="nav-item" data-goto="flashcard"><span class="dot"></span><span>Flashcard</span></div>
  `;
}
function renderFlashcardView(){
  const t = topics[currentTopicIndex];
  const wasFlipped = seenTopics.has(t.id);
  return `
    <div class="flashcard ${wasFlipped ? "flipped" : ""}" id="flashcard">
      <div class="flip-inner">
        <div class="face front">
          <div class="eyebrow">Flashcard ${currentTopicIndex + 1}/${topics.length}</div>
          <h2>${t.front}</h2>
          <p class="teaser">${t.title}</p>
          <div class="flip-hint">↻ Nhấn vào thẻ để xem lý thuyết + ví dụ</div>
        </div>
        <div class="face back ${wasFlipped ? "expanded" : ""}" id="backFace">
          <div class="flip-hint">↻ Nhấn để lật lại mặt trước</div>
          <h3>${t.title}</h3>
          <div class="theory">${t.theory.map(p => `<p>${p}</p>`).join("")}</div>
          <div class="section-label">Ví dụ thực tế (Java)</div>
          <pre class="example"><code>${highlightJava(t.example)}</code></pre>
        </div>
      </div>
    </div>
    <div class="footer-nav">
      <button id="prevTopic" ${currentTopicIndex === 0 ? "disabled" : ""}>← Chủ đề trước</button>
      <button id="nextTopic" ${currentTopicIndex === topics.length - 1 ? "disabled" : ""}>Chủ đề tiếp →</button>
    </div>
  `;
}

/* ============================================================
   QUIZ: chọn nhóm
   ============================================================ */
function renderQuizPick(){
  const cats = [...new Set(quizBank.map(q => q.cat))];
  let cards = cats.map(cat => {
    const n = quizBank.filter(q => q.cat === cat).length;
    return `<div class="quiz-opt" data-cat="${cat}"><h4>${cat}</h4><span>${n} câu</span></div>`;
  }).join("");
  return `
    <div class="topbar"><h2>Kiểm tra</h2></div>
    <p style="color:var(--text-dim); font-size:14px; margin-bottom:6px;">Chọn một nhóm kiến thức để luyện tập riêng, hoặc làm trọn bộ 24 câu.</p>
    <div class="quiz-picker">
      <div class="quiz-opt full" data-cat="__all__"><h4>Làm toàn bộ</h4><span>24 câu — tất cả 8 nhóm kiến thức</span></div>
      ${cards}
    </div>
  `;
}

/* ============================================================
   QUIZ: chạy bài
   ============================================================ */
function startQuiz(catKey){
  lastCatKey = catKey;
  activeQuiz = shuffle(catKey === "__all__" ? quizBank : quizBank.filter(q => q.cat === catKey));
  activeCatLabel = catKey === "__all__" ? "Toàn bộ" : catKey;
  qIndex = 0; qScore = 0; answered = false;
  view = "quiz-run";
  render();
}

function renderQuizRun(){
  const q = activeQuiz[qIndex];
  return `
    <div class="topbar"><h2>Kiểm tra — ${activeCatLabel}</h2></div>
    <div class="quiz-progress">Câu ${qIndex + 1}/${activeQuiz.length} · Điểm hiện tại: ${qScore}</div>
    <div class="quiz-card">
      <div class="cat">${q.cat}</div>
      <p class="q">${escapeHtml(q.q)}</p>
      ${q.opts.map((opt, i) => `<button class="opt-btn" data-idx="${i}">${escapeHtml(opt)}</button>`).join("")}
      <div class="explain" id="explainBox"></div>
      <button class="next-btn" id="nextQBtn">${qIndex === activeQuiz.length - 1 ? "Xem kết quả" : "Câu tiếp →"}</button>
    </div>
  `;
}

function handleAnswer(idx){
  if (answered) return;
  answered = true;
  const q = activeQuiz[qIndex];
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add("correct");
    else if (i === idx) b.classList.add("wrong");
  });
  if (idx === q.correct) qScore++;
  const explainBox = document.getElementById("explainBox");
  explainBox.textContent = q.exp;
  explainBox.classList.add("show");
  document.getElementById("nextQBtn").classList.add("show");
}

function nextQuestion(){
  if (qIndex < activeQuiz.length - 1){
    qIndex++; answered = false;
    render();
  } else {
    // lưu lịch sử
    const perCat = {};
    activeQuiz.forEach((q, i) => {
      perCat[q.cat] = perCat[q.cat] || { total:0, correct:0 };
      perCat[q.cat].total++;
    });
    quizHistory.push({
      date: new Date(),
      cat: activeCatLabel,
      total: activeQuiz.length,
      correct: qScore,
      perCat // lưu cấu trúc nhóm để cộng dồn ở trang thống kê (độ chính xác theo nhóm tính ở renderStats)
    });
    view = "quiz-result";
    render();
  }
}

function renderQuizResult(){
  const pct = Math.round((qScore / activeQuiz.length) * 100);
  return `
    <div class="topbar"><h2>Kết quả — ${activeCatLabel}</h2></div>
    <div class="result-card">
      <div class="score">${qScore}/${activeQuiz.length}</div>
      <div class="pct">Đúng ${pct}%</div>
      <div class="result-actions">
        <button class="primary" id="retryBtn">Làm lại</button>
        <button id="toStatsBtn">Xem thống kê</button>
        <button id="toHomeBtn">Về trang chủ</button>
      </div>
    </div>
  `;
}

/* ============================================================
   STATS VIEW
   ============================================================ */
function renderStats(){
  if (quizHistory.length === 0){
    return `
      <div class="topbar"><h2>Thống kê kết quả học tập</h2></div>
      <div class="empty-state">Chưa có lượt làm bài nào trong phiên này. Vào mục "Kiểm tra" để bắt đầu.</div>
    `;
  }

  const totalAttempts = quizHistory.length;
  const totalQuestions = quizHistory.reduce((s, h) => s + h.total, 0);
  const totalCorrect = quizHistory.reduce((s, h) => s + h.correct, 0);
  const avgPct = Math.round((totalCorrect / totalQuestions) * 100);

  // cộng dồn đúng/sai theo từng câu hỏi thực tế đã làm — tính lại từ activeQuiz là không khả thi sau khi xong,
  // nên ta tính theo tỉ lệ điểm mỗi lượt áp vào các category của lượt đó (ước lượng đều cho mỗi câu trong lượt)
  const catTotals = {};
  quizHistory.forEach(h => {
    const ratio = h.correct / h.total;
    Object.keys(h.perCat).forEach(cat => {
      catTotals[cat] = catTotals[cat] || { total:0, correctEst:0 };
      catTotals[cat].total += h.perCat[cat].total;
      catTotals[cat].correctEst += h.perCat[cat].total * ratio;
    });
  });

  const bars = Object.keys(catTotals).map(cat => {
    const t = catTotals[cat];
    const p = Math.round((t.correctEst / t.total) * 100);
    return `<div class="bar-row">
      <div class="name">${cat}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>
      <div class="pct">${p}%</div>
    </div>`;
  }).join("");

  const history = quizHistory.slice().reverse().map(h => {
    const t = h.date.toLocaleTimeString("vi-VN", { hour:"2-digit", minute:"2-digit" });
    return `<div class="history-row"><span>${t} — ${h.cat}</span><span>${h.correct}/${h.total}</span></div>`;
  }).join("");

  return `
    <div class="topbar"><h2>Thống kê kết quả học tập</h2></div>
    <div class="stat-cards">
      <div class="stat-card"><div class="num">${totalAttempts}</div><div class="label">Lượt làm bài</div></div>
      <div class="stat-card"><div class="num">${avgPct}%</div><div class="label">Tỉ lệ đúng trung bình</div></div>
      <div class="stat-card"><div class="num">${totalCorrect}/${totalQuestions}</div><div class="label">Tổng số câu đúng</div></div>
    </div>
    <div class="section-label">Theo nhóm kiến thức</div>
    ${bars}
    <div class="section-label">Lịch sử làm bài</div>
    ${history}
    <div class="note">Thống kê được tính trong phiên làm việc hiện tại — sẽ mất khi tải lại trang.</div>
  `;
}

/* ============================================================
   GẮN SỰ KIỆN THEO VIEW
   ============================================================ */
function attachViewHandlers(){
  document.querySelectorAll(".nav-item[data-topic]").forEach(el => {
    el.addEventListener("click", () => { currentTopicIndex = parseInt(el.dataset.topic, 10); render(); });
  });
  document.querySelectorAll(".nav-item[data-goto]").forEach(el => {
    el.addEventListener("click", () => { view = el.dataset.goto; render(); });
  });

  if (view === "flashcard"){
    const card = document.getElementById("flashcard");
    const t = topics[currentTopicIndex];
    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
      seenTopics.add(t.id);
      const back = document.getElementById("backFace");
      setTimeout(() => { if (card.classList.contains("flipped")) back.classList.add("expanded"); }, 260);
      renderTopicNavOnly();
    });
    const prevBtn = document.getElementById("prevTopic");
    const nextBtn = document.getElementById("nextTopic");
    if (prevBtn) prevBtn.addEventListener("click", () => { if (currentTopicIndex > 0){ currentTopicIndex--; render(); } });
    if (nextBtn) nextBtn.addEventListener("click", () => { if (currentTopicIndex < topics.length - 1){ currentTopicIndex++; render(); } });
  }

  if (view === "quiz-pick"){
    document.querySelectorAll(".quiz-opt").forEach(el => {
      el.addEventListener("click", () => startQuiz(el.dataset.cat));
    });
  }

  if (view === "quiz-run"){
    document.querySelectorAll(".opt-btn").forEach(btn => {
      btn.addEventListener("click", () => handleAnswer(parseInt(btn.dataset.idx, 10)));
    });
    const nextQBtn = document.getElementById("nextQBtn");
    if (nextQBtn) nextQBtn.addEventListener("click", nextQuestion);
  }

  if (view === "quiz-result"){
    document.getElementById("retryBtn").addEventListener("click", () => startQuiz(lastCatKey));
    document.getElementById("toStatsBtn").addEventListener("click", () => { view = "stats"; render(); });
    document.getElementById("toHomeBtn").addEventListener("click", () => { view = "home"; render(); });
  }
}

// cập nhật nhẹ sidebar (đánh dấu "đã xem") mà không render lại toàn bộ main (tránh mất trạng thái lật thẻ)
function renderTopicNavOnly(){
  const nav = document.querySelector(".sidebar");
  const items = nav.querySelectorAll(".nav-item[data-topic]");
  items.forEach((el, i) => {
    el.classList.toggle("seen", seenTopics.has(topics[i].id));
  });
}

render();
</script>
